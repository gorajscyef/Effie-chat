<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Effie Voice Test</title>
<style>
:root{--bg:#000;--gold:#cdae75;--muted:rgba(205,174,117,.7)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--gold);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}.card{width:min(560px,100%);text-align:center}.orb{width:190px;height:190px;border-radius:50%;margin:0 auto 30px;background:radial-gradient(circle at 30% 25%,#ffd978 0 8%,#d08a00 28%,#3a1832 58%,#0b2b75 78%,#020817 100%);box-shadow:0 0 50px rgba(205,174,117,.18);transition:transform .25s ease,box-shadow .25s ease}.orb.live{transform:scale(1.04);box-shadow:0 0 70px rgba(205,174,117,.38)}h1{font-weight:500;letter-spacing:.04em}.status{min-height:26px;color:var(--muted);margin:12px 0 22px}button{border:1px solid var(--gold);background:var(--gold);color:#111;border-radius:999px;padding:14px 24px;font-size:17px;font-weight:700;cursor:pointer}button.secondary{background:transparent;color:var(--gold);margin-left:10px}button:disabled{opacity:.5;cursor:not-allowed}.note{font-size:13px;line-height:1.5;color:rgba(205,174,117,.55);margin-top:24px}
</style>
</head>
<body>
<main class="card">
  <div id="orb" class="orb"></div>
  <h1>Effie — Voice Test</h1>
  <div id="status" class="status">Ready to connect.</div>
  <button id="startBtn">Start talking</button>
  <button id="stopBtn" class="secondary" disabled>Stop</button>
  <audio id="remoteAudio" autoplay playsinline></audio>
  <div class="note">Temporary test page. It does not change the existing Effie chat, Emka or memory.</div>
</main>
<script src="/effie-identity.js"></script>
<script>
const startBtn=document.getElementById('startBtn');
const stopBtn=document.getElementById('stopBtn');
const statusEl=document.getElementById('status');
const remoteAudio=document.getElementById('remoteAudio');
const orb=document.getElementById('orb');
const REQUEST_TIMEOUT_MS=15000;
const CONNECTION_TIMEOUT_MS=20000;
let pc=null,stream=null,dc=null,connectionTimer=null,isStopping=false;
function status(t){statusEl.textContent=t}
function getUserId(){
  return window.EffieIdentity.getUserId();
}
async function fetchWithTimeout(url,options={},timeoutMs=REQUEST_TIMEOUT_MS){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeoutMs);
  try{return await fetch(url,{...options,signal:controller.signal})}
  finally{clearTimeout(timer)}
}
function friendlyError(err){
  if(err?.name==='NotAllowedError') return 'Microphone access was not allowed.';
  if(err?.name==='NotFoundError') return 'No microphone was found.';
  if(err?.name==='AbortError') return 'The connection took too long. Please try again.';
  return err?.message || 'Unknown connection error.';
}
async function start(){
  if(pc) return;
  startBtn.disabled=true; status('Creating secure Effie session…');
  try{
    const secretRes=await fetchWithTimeout('/.netlify/functions/realtime-session',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({user_id:getUserId()})
    });
    if(!secretRes.ok){
      const details=await secretRes.json().catch(()=>({}));
      throw new Error(details.error || 'Session endpoint returned '+secretRes.status);
    }
    const secretData=await secretRes.json();
    const ephemeralKey=secretData?.value || secretData?.client_secret?.value;
    if(!ephemeralKey) throw new Error('No temporary client secret returned');

    pc=new RTCPeerConnection();
    pc.ontrack=e=>{
      remoteAudio.srcObject=e.streams[0];
      remoteAudio.play().catch(()=>status('Tap Start talking again to enable audio.'));
    };
    pc.onconnectionstatechange=()=>{
      const state=pc?.connectionState;
      if(state==='connected'){
        clearTimeout(connectionTimer);connectionTimer=null;
        status('Connected. Just talk to Effie.');orb.classList.add('live');stopBtn.disabled=false;
      }
      if(['failed','disconnected','closed'].includes(state) && !isStopping){
        stop('Connection ended. Tap Start talking to reconnect.');
      }
    };

    stream=await navigator.mediaDevices.getUserMedia({
      audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}
    });
    stream.getTracks().forEach(track=>pc.addTrack(track,stream));

    dc=pc.createDataChannel('oai-events');
    dc.onopen=()=>status('Connected. Just talk to Effie.');
    dc.onerror=()=>status('The Effie audio connection encountered an error.');
    dc.onmessage=e=>{
      try{
        const evt=JSON.parse(e.data);
        if(evt.type==='input_audio_buffer.speech_started') status('Effie is listening…');
        if(evt.type==='response.audio.done' || evt.type==='response.done') status('Connected. Just talk to Effie.');
        if(evt.type==='error'){
          console.error('Realtime error',evt);
          status('Effie encountered an audio error. Please reconnect.');
        }
      }catch{}
    };

    const offer=await pc.createOffer();
    await pc.setLocalDescription(offer);
    const sdpRes=await fetchWithTimeout('https://api.openai.com/v1/realtime/calls',{
      method:'POST',
      body:offer.sdp,
      headers:{Authorization:'Bearer '+ephemeralKey,'Content-Type':'application/sdp'}
    });
    if(!sdpRes.ok) throw new Error('Realtime call returned '+sdpRes.status);
    const answer={type:'answer',sdp:await sdpRes.text()};
    await pc.setRemoteDescription(answer);
    connectionTimer=setTimeout(()=>{
      if(pc?.connectionState!=='connected') stop('Connection timed out. Tap Start talking to try again.');
    },CONNECTION_TIMEOUT_MS);
  }catch(err){
    console.error(err);stop('Could not connect: '+friendlyError(err));
  }
}
function stop(message='Stopped.'){
  isStopping=true;
  clearTimeout(connectionTimer);connectionTimer=null;
  try{dc?.close()}catch{}; try{pc?.close()}catch{}; stream?.getTracks().forEach(t=>t.stop());
  pc=null;dc=null;stream=null;remoteAudio.srcObject=null;orb.classList.remove('live');
  stopBtn.disabled=true;startBtn.disabled=false;status(message);
  isStopping=false;
}
startBtn.addEventListener('click',start); stopBtn.addEventListener('click',()=>stop());
window.addEventListener('pagehide',()=>stop());
</script>
</body>
</html>
